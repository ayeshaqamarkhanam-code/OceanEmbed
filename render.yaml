# Render.com blueprint. Deploy from the REPO ROOT, not the backend/ folder —
# model_runner.py reaches up into OceanML/ for the model weights and data
# files, so both directories must exist in the deployed filesystem together.
# In Render dashboard: New -> Blueprint, point it at this repo's root.
services:
  - type: web
    name: oceanembed-backend
    env: python
    plan: free
    buildCommand: "pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
